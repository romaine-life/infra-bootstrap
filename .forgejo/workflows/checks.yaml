name: Checks

# The checks no suite runs here: this repository's file conventions (a trailing newline,
# .yaml rather than .yml, no underscores in names but where a format expects them), which
# read every tracked file and so run on every change; and the NATS chart guard. The tofu
# suite formats, validates and plans tofu/ (pipeline-templates fleet.json).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every tracked file follows the conventions
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, re
          for file in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not file or not pathlib.Path(file).is_file(): continue
              data = pathlib.Path(file).read_bytes()
              if data and b'\0' not in data and not data.endswith(b'\n'):
                  raise SystemExit(f'Missing trailing newline: {file}')
              if file.endswith('.yml'): raise SystemExit(f'Use .yaml: {file}')
              if '_' in file and not re.search(r'PULL_REQUEST_TEMPLATE|ISSUE_TEMPLATE|\.(md|js|py|webp|png|jpe?g|gif|svg|ico|txt)$', file):
                  raise SystemExit(f'Underscore in filename: {file}')
          PY
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qE '^k8s/nats/|^scripts/check-nats-chart\.mjs$|^\.forgejo/workflows/checks\.yaml$' <<< "$files"; then echo nats=true >> "$GITHUB_OUTPUT"; fi
      - name: The NATS chart keeps its hardening
        if: steps.diff.outputs.nats == 'true'
        run: node scripts/check-nats-chart.mjs
