name: Update Tofu Lockfile
on:
  workflow_dispatch:
jobs:
  lockfile-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.11.0'
      - name: Update locks and open a checked pull request
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tofu/provider
          tofu init -upgrade
          tofu providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=windows_amd64
          cd ../..
          if git diff --quiet; then exit 0; fi
          branch="FORGEJO-3-lockfile-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name forgejo-actions
          git config user.email forgejo-actions@romaine.life
          git add tofu/provider/.terraform.lock.hcl
          git commit -m "Refresh OpenTofu provider locks"
          git push origin "$branch"
          jq -n --arg head "$branch" '{head:$head,base:"main",title:"Refresh OpenTofu provider locks",body:"https://openproject.romaine.life/wp/FORGEJO-3"}' > /tmp/lock-pr.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/lock-pr.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls"
