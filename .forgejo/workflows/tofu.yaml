name: Infrastructure
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: opentofu-infra-bootstrap.tfstate
  cancel-in-progress: false
permissions:
  id-token: write
  contents: write
  pull-requests: write
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    enable-openid-connect: true
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: romaine-life/pipeline-templates/actions/home-cache@main
    - uses: romaine-life/pipeline-templates/actions/azure-cli@main
    - name: Install kubectl through Artifact Keeper
      env:
        VERSION: v1.35.0
      run: |
        set -euo pipefail
        base="https://artifacts.home.romaine.life/general/k8s-dl/release/$VERSION/bin/linux/amd64"
        dir="$RUNNER_TEMP/kubectl"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/kubectl" "$base/kubectl"
        echo "$(curl -fsSL "$base/kubectl.sha256")  $dir/kubectl" | sha256sum -c -
        chmod +x "$dir/kubectl"
        echo "$dir" >> "$GITHUB_PATH"
    - uses: azure/setup-helm@v5
      with:
        version: v4.3.1
        downloadBaseURL: https://artifacts.home.romaine.life/general/helm-downloads/
    - name: Setup OpenTofu
      uses: romaine-life/pipeline-templates/actions/setup-opentofu@main
      with:
        tofu-version: 1.11.0
    - name: Azure Login via OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ vars.ARM_CLIENT_ID }}
        tenant-id: ${{ vars.ARM_TENANT_ID }}
        subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
    - name: Fetch secrets from Key Vault
      id: secrets
      run: |
        # infra-bootstrap-github-app identifiers (non-secret) for the org provider.
        GH_APP_ID=$(az keyvault secret show --vault-name romaine-kv --name infra-bootstrap-github-app-id --query value -o tsv)
        GH_APP_INSTALL_ID=$(az keyvault secret show --vault-name romaine-kv --name infra-bootstrap-github-app-installation-id --query value -o tsv)
        echo "github_app_id=$GH_APP_ID" >> $GITHUB_OUTPUT
        echo "github_app_installation_id=$GH_APP_INSTALL_ID" >> $GITHUB_OUTPUT
    - name: Initialize OpenTofu
      working-directory: tofu
      env:
        ARM_USE_OIDC: 'true'
        ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      run: |
        tofu init \
          -backend-config="resource_group_name=infra" \
          -backend-config="storage_account_name=nelsontofu" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=infra-bootstrap.tfstate"
    - name: Plan
      id: plan
      working-directory: tofu
      env:
        ARM_USE_OIDC: 'true'
        ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        TF_VAR_github_app_id: ${{ steps.secrets.outputs.github_app_id }}
        TF_VAR_github_app_installation_id: ${{ steps.secrets.outputs.github_app_installation_id }}
        TF_VAR_cluster_subscription_id: ${{ vars.CLUSTER_ARM_SUBSCRIPTION_ID }}
        TF_VAR_cluster_resource_group_name: ${{ vars.CLUSTER_RESOURCE_GROUP_NAME || 'infra' }}
      run: |
        set -o pipefail
        # PEM held only in this shell (never an output var / never logged).
        export TF_VAR_github_app_pem="$(az keyvault secret show --vault-name romaine-kv --name infra-bootstrap-github-app-private-key --query value -o tsv)"
        tofu plan -lock-timeout=10m -out=tfplan 2>&1 | tee plan_output.txt

        # Check plan for actual changes using tofu show
        PLAN_JSON=$(tofu show -json tfplan)
        RESOURCE_CHANGES=$(echo "$PLAN_JSON" | jq '[.resource_changes[]? | select((.change.actions | . != ["no-op"]) or .change.importing)] | length')

        echo "Resource changes detected: $RESOURCE_CHANGES"
        if [ "$RESOURCE_CHANGES" -gt 0 ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "### Infrastructure changes detected ($RESOURCE_CHANGES resources)" >> $GITHUB_STEP_SUMMARY
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "### No infrastructure changes detected" >> $GITHUB_STEP_SUMMARY
        fi
    - name: Apply
      if: github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
      working-directory: tofu
      env:
        ARM_USE_OIDC: 'true'
        ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        TF_VAR_github_app_id: ${{ steps.secrets.outputs.github_app_id }}
        TF_VAR_github_app_installation_id: ${{ steps.secrets.outputs.github_app_installation_id }}
        TF_VAR_cluster_subscription_id: ${{ vars.CLUSTER_ARM_SUBSCRIPTION_ID }}
        TF_VAR_cluster_resource_group_name: ${{ vars.CLUSTER_RESOURCE_GROUP_NAME || 'infra' }}
      run: |
        # PEM held only in this shell (never an output var / never logged).
        export TF_VAR_github_app_pem="$(az keyvault secret show --vault-name romaine-kv --name infra-bootstrap-github-app-private-key --query value -o tsv)"
        tofu apply -lock-timeout=10m tfplan
        echo "### Apply successful" >> $GITHUB_STEP_SUMMARY
    - name: Get AKS credentials
      id: aks
      if: github.event_name != 'pull_request'
      env:
        CLUSTER_ARM_SUBSCRIPTION_ID: ${{ vars.CLUSTER_ARM_SUBSCRIPTION_ID || vars.ARM_SUBSCRIPTION_ID }}
        CLUSTER_RESOURCE_GROUP_NAME: ${{ vars.CLUSTER_RESOURCE_GROUP_NAME || 'infra' }}
      run: |
        if az aks get-credentials --subscription "$CLUSTER_ARM_SUBSCRIPTION_ID" --resource-group "$CLUSTER_RESOURCE_GROUP_NAME" --name infra-aks 2>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "### Bootstrap skipped — AKS cluster not found" >> $GITHUB_STEP_SUMMARY
        fi
    - name: Check ArgoCD
      id: argocd
      if: steps.aks.outputs.exists == 'true'
      run: |
        if kubectl get namespace argocd 2>/dev/null \
          && kubectl get deploy argocd-server -n argocd 2>/dev/null \
          && kubectl get application.argoproj.io apps -n argocd 2>/dev/null; then
          echo "status=deployed" >> $GITHUB_OUTPUT
        else
          echo "status=install" >> $GITHUB_OUTPUT
        fi
    - name: Install ArgoCD
      if: steps.aks.outputs.exists == 'true' && steps.argocd.outputs.status == 'install'
      env:
        CLUSTER_ARM_SUBSCRIPTION_ID: ${{ vars.CLUSTER_ARM_SUBSCRIPTION_ID || vars.ARM_SUBSCRIPTION_ID }}
        CLUSTER_RESOURCE_GROUP_NAME: ${{ vars.CLUSTER_RESOURCE_GROUP_NAME || 'infra' }}
      run: |
        kubectl delete namespace argocd --ignore-not-found --wait=true
        kubectl delete crd \
          applications.argoproj.io \
          applicationsets.argoproj.io \
          appprojects.argoproj.io \
          --ignore-not-found --wait=true
        kubectl delete clusterrole \
          argocd-application-controller \
          argocd-server \
          --ignore-not-found --wait=true
        kubectl delete clusterrolebinding \
          argocd-application-controller \
          argocd-server \
          --ignore-not-found --wait=true

        AKS_OIDC_ISSUER=$(az aks show \
          --subscription "$CLUSTER_ARM_SUBSCRIPTION_ID" \
          --resource-group "$CLUSTER_RESOURCE_GROUP_NAME" \
          --name infra-aks \
          --query oidcIssuerProfile.issuerUrl \
          -o tsv)
        export AKS_OIDC_ISSUER

        python3 - <<'PY'
        import os
        import re
        from pathlib import Path

        values = Path("k8s/argocd/values.yaml").read_text()
        values = re.sub(
            r"issuer: https://westus2\.oic\.prod-aks\.azure\.com/[^\n]+", # internet: Azure issuer pattern only
            f"issuer: {os.environ['AKS_OIDC_ISSUER']}",
            values,
        )
        Path("/tmp/argocd-values.yaml").write_text(values)
        PY

        helm upgrade --install argocd https://artifacts.home.romaine.life/general/github/argoproj/argo-helm/releases/download/argo-cd-9.5.2/argo-cd-9.5.2.tgz \
          --version 9.5.2 \
          --namespace argocd \
          --create-namespace \
          --values /tmp/argocd-values.yaml \
          --wait \
          --timeout 5m
        kubectl rollout status deploy/argocd-server -n argocd --timeout=5m
    - name: Configure Docker Hub repo access
      if: steps.aks.outputs.exists == 'true' && steps.argocd.outputs.status == 'install'
      run: |
        DOCKER_USER=$(az keyvault secret show --vault-name romaine-kv --name docker-hub-username --query value -o tsv)
        DOCKER_TOKEN=$(az keyvault secret show --vault-name romaine-kv --name docker-hub-token --query value -o tsv)
        kubectl create secret generic docker-hub-repo \
          --namespace argocd \
          --from-literal=type=helm \
          --from-literal=url=registry-1.docker.io \
          --from-literal=enableOCI=true \
          --from-literal=username="$DOCKER_USER" \
          --from-literal=password="$DOCKER_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl label secret docker-hub-repo \
          --namespace argocd \
          argocd.argoproj.io/secret-type=repository \
          --overwrite
    - name: Apply ArgoCD apps
      if: steps.aks.outputs.exists == 'true' && steps.argocd.outputs.status == 'install'
      run: |
        kubectl apply -f k8s/apps/
        kubectl apply -f k8s/root-app.yaml
    - name: Apply ArgoCD root app
      if: steps.aks.outputs.exists == 'true' && steps.argocd.outputs.status == 'deployed'
      run: |
        kubectl apply -f k8s/root-app.yaml
    - name: Bootstrap summary
      if: steps.aks.outputs.exists == 'true'
      run: |
        echo "### Cluster Bootstrap Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.argocd.outputs.status }}" = "install" ]; then
          echo "🆕 ArgoCD installed and apps applied. Components deploying via ArgoCD." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔑 Get ArgoCD admin password:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ ArgoCD already deployed. Apps re-applied." >> $GITHUB_STEP_SUMMARY
        fi
    - name: Release validated infrastructure
      if: github.event_name != 'pull_request'
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch --tags
        tag=$(git tag -l 'v0.1.*' --sort=-v:refname | head -1)
        n=${tag##*.}
        tag="v0.1.$((${n:-0} + 1))"
        jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" '{tag_name:$tag,target_commitish:$sha,name:$tag,body:("Validated infrastructure source at " + $sha)}' > /tmp/release.json
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data-binary @/tmp/release.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
